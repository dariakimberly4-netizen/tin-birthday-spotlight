<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070315"><title>The Universe Is Trying to Spell Tin</title><style>:root{--gold:#ffd37d;--pink:#ff89cf}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070315;color:#fff;font-family:Arial,sans-serif}button{font:inherit;touch-action:manipulation}.sky,.stars,.nebula{position:fixed;inset:0;pointer-events:none}.sky{background:linear-gradient(#070315,#16052b)}.nebula{background:radial-gradient(circle at 50% 42%,#641c8b55,transparent 31%),radial-gradient(circle at 12% 75%,#255f9c44,transparent 24%)}.stars{background-image:radial-gradient(#fff 0 1px,transparent 1.5px);background-size:37px 37px;opacity:.36}.open{position:fixed;z-index:40;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#05000de8;transition:.8s}.open.hide{opacity:0;visibility:hidden;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:.27em;color:var(--gold);text-transform:uppercase}.open h1{font:400 clamp(50px,10vw,118px)/.84 Georgia,serif;letter-spacing:-.06em;margin:18px auto;max-width:1000px}.open h1 em{display:block;color:var(--pink);font-weight:400}.open p{max-width:700px;margin:0 auto 26px;color:#dcc9e9;font:italic clamp(17px,2vw,23px)/1.55 Georgia,serif}.pill{border:0;border-radius:999px;min-height:58px;padding:18px 30px;background:linear-gradient(135deg,var(--gold),var(--pink));color:#32142d;font-weight:900;letter-spacing:.11em;text-transform:uppercase}.app{position:fixed;inset:0;opacity:0;visibility:hidden;pointer-events:none;transition:.8s}.app.on{opacity:1;visibility:visible;pointer-events:auto}.top{position:absolute;z-index:30;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:15px 18px;background:linear-gradient(#06010ef2,transparent);pointer-events:none}.brand{font:italic clamp(17px,2.5vw,27px) Georgia,serif}.status{text-align:right;font-size:10px;letter-spacing:.12em;color:#ccb8d8;text-transform:uppercase}.status b{display:block;color:var(--gold);font-size:15px}.space{position:absolute;inset:60px 0 74px;overflow:hidden}.field{position:absolute;inset:0;transition:transform 1.8s ease}.app.revealed .field{transform:scale(.94)}.photo{position:absolute;left:50%;top:50%;width:48px;height:48px;padding:0;border:2px solid #ffffffc9;border-radius:50%;background:#14051f;overflow:hidden;box-shadow:0 9px 25px #000c,0 0 16px #ffffff1c;transition:width 1.1s,height 1.1s,border-color .3s,box-shadow .3s;z-index:5}.photo img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;border-radius:50%;pointer-events:none}.photo.seen{border-color:var(--gold);box-shadow:0 0 22px #ffd37dcc}.app.revealed .photo{width:24px;height:24px;border:1px solid #fff4d5;box-shadow:0 0 13px #ffd37ddd}.modal{position:fixed;z-index:70;inset:0;display:none;place-items:center;background:#030008e8;padding:18px}.modal.on{display:grid}.card{position:relative;width:min(94vw,720px);max-height:90vh;border:1px solid #ffffff33;border-radius:24px;background:#160722;padding:14px}.card img{display:block;max-width:100%;max-height:78vh;margin:auto;object-fit:contain;border-radius:14px}.x{position:absolute;right:8px;top:8px;width:54px;height:54px;border-radius:50%;border:1px solid #ffffff44;background:#0a0212e8;color:#fff;font-size:25px}.revealBtn{position:absolute;z-index:35;left:50%;bottom:14px;transform:translateX(-50%);border:1px solid #ffd37d88;border-radius:999px;background:#160823ee;color:var(--gold);padding:13px 22px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;min-height:48px;white-space:nowrap}.app.revealed .revealBtn{background:linear-gradient(135deg,var(--gold),var(--pink));color:#32142d}.revealTitle{position:absolute;z-index:25;left:50%;bottom:62px;transform:translateX(-50%);text-align:center;opacity:0;transition:1s;pointer-events:none;white-space:nowrap}.app.revealed .revealTitle{opacity:1}.revealTitle small{display:block;color:var(--gold);letter-spacing:.24em;text-transform:uppercase;font-size:9px}.revealTitle strong{font:italic clamp(25px,5vw,48px) Georgia,serif;color:#ff9bd2}@media(min-width:721px){.photo{width:58px;height:58px}.app.revealed .photo{width:31px;height:31px}}@media(max-width:390px){.photo{width:45px;height:45px}.app.revealed .photo{width:21px;height:21px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.2s!important}}</style></head><body><div class="sky"></div><div class="nebula"></div><div class="stars"></div><section class="open" id="open"><div><div class="eyebrow">Cosmic birthday anomaly detected</div><h1>The Universe Is Trying <em>to Spell Tin</em></h1><p>Forty-three memories are drifting through space. Explore them, then watch every photo lock into T I N.</p><button class="pill" id="start">Enter the universe</button></div></section><main class="app" id="app"><header class="top"><div class="brand">Tin’s Memory Universe</div><div class="status">Memories explored <b id="meter">0 / 43</b></div></header><div class="space"><div class="field" id="field"></div></div><div class="revealTitle"><small>All 43 real photos formed</small><strong>T I N ✨</strong></div><button class="revealBtn" id="revealBtn">Reveal T I N</button></main><div class="modal" id="modal"><div class="card"><button class="x" id="close">×</button><img id="big" alt=""></div></div><script>const TOTAL=43,app=document.getElementById('app'),field=document.getElementById('field'),meter=document.getElementById('meter'),modal=document.getElementById('modal'),big=document.getElementById('big'),seen=new Set(),cards=[];const targets=[[8,20],[13,20],[18,20],[23,20],[28,20],[33,20],[38,20],[23,30],[23,39],[23,48],[23,57],[23,66],[23,75],[23,84],[23,92],[46,20],[52,20],[58,20],[52,31],[52,43],[52,55],[52,67],[52,79],[46,91],[52,91],[58,91],[70,20],[70,34],[70,48],[70,62],[70,76],[70,90],[75,34],[80,48],[85,62],[90,76],[94,20],[94,34],[94,48],[94,62],[94,76],[94,90],[90,90]];const rand=(a,b)=>Math.random()*(b-a)+a;for(let i=1;i<=TOTAL;i++){const b=document.createElement('button');b.className='photo';b.setAttribute('aria-label','Open photo '+i);b.innerHTML=`<img src="photos/${String(i).padStart(2,'0')}.jpg" alt="">`;const t=targets[i-1],o={el:b,n:i,seen:false,bx:rand(7,93),by:rand(10,90),ax:rand(4,10),ay:rand(4,9),sx:rand(.2,.5),sy:rand(.18,.44),p:rand(0,6.28),q:rand(0,6.28),tx:t[0],ty:t[1]};b.onclick=()=>openPhoto(o);cards.push(o);field.appendChild(b)}function openPhoto(o){if(!o.seen){o.seen=true;seen.add(o.n);o.el.classList.add('seen');meter.textContent=`${seen.size} / 43`;if(seen.size===TOTAL)setTimeout(reveal,350)}big.src=`photos/${String(o.n).padStart(2,'0')}.jpg`;modal.classList.add('on')}function reveal(){app.classList.add('revealed');document.getElementById('revealBtn').textContent='T I N ✨'}document.getElementById('revealBtn').onclick=()=>reveal();document.getElementById('close').onclick=()=>modal.classList.remove('on');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('on')};document.getElementById('start').onclick=()=>{document.getElementById('open').classList.add('hide');app.classList.add('on')};function animate(ms){const t=ms/1000,revealed=app.classList.contains('revealed'),progress=seen.size/TOTAL;cards.forEach(o=>{const cx=o.bx+Math.sin(t*o.sx+o.p)*o.ax+Math.cos(t*.31+o.q)*o.ax*.22,cy=o.by+Math.cos(t*o.sy+o.q)*o.ay+Math.sin(t*.39+o.p)*o.ay*.2;const mix=revealed?1:Math.min(.68,progress*.58+(o.seen?.12:0)),x=cx*(1-mix)+o.tx*mix,y=cy*(1-mix)+o.ty*mix,depth=1+Math.sin(t*.7+o.p)*.07*(1-mix);o.el.style.left=x+'%';o.el.style.top=y+'%';o.el.style.transform=`translate(-50%,-50%) scale(${depth})`;o.el.style.zIndex=o.seen?120:20});requestAnimationFrame(animate)}requestAnimationFrame(animate);</script></body></html>
