<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070315"><title>The Universe Is Trying to Spell Tin</title><style>
:root{--bg:#070315;--bg2:#16052b;--gold:#ffd37d;--pink:#ff89cf}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Arial,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}.sky,.stars,.nebula{position:fixed;inset:0;pointer-events:none}.sky{background:linear-gradient(var(--bg),var(--bg2))}.nebula{background:radial-gradient(circle at 50% 42%,#641c8b55,transparent 31%),radial-gradient(circle at 12% 75%,#255f9c44,transparent 24%)}.stars{background-image:radial-gradient(#fff 0 1px,transparent 1.5px);background-size:37px 37px;opacity:.36;animation:drift 28s linear infinite}@keyframes drift{to{transform:translateY(37px)}}
.open{position:fixed;z-index:40;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#05000de8;transition:.8s}.open.hide{opacity:0;visibility:hidden;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:.27em;color:var(--gold);text-transform:uppercase}.open h1{font:400 clamp(50px,10vw,118px)/.84 Georgia,serif;letter-spacing:-.06em;margin:18px auto;max-width:1000px}.open h1 em{display:block;color:var(--pink);font-weight:400}.open p{max-width:700px;margin:0 auto 26px;color:#dcc9e9;font:italic clamp(17px,2vw,23px)/1.55 Georgia,serif}.pill{border:0;border-radius:999px;min-height:58px;padding:18px 30px;background:linear-gradient(135deg,var(--gold),var(--pink));color:#32142d;font-weight:900;letter-spacing:.11em;text-transform:uppercase}
.app{position:fixed;inset:0;opacity:0;visibility:hidden;pointer-events:none;transition:.8s}.app.on{opacity:1;visibility:visible;pointer-events:auto}.top{position:absolute;z-index:30;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:15px 18px;background:linear-gradient(#06010ef2,transparent);pointer-events:none}.brand{font:italic clamp(17px,2.5vw,27px) Georgia,serif}.status{text-align:right;font-size:10px;letter-spacing:.12em;color:#ccb8d8;text-transform:uppercase}.status b{display:block;color:var(--gold);font-size:15px}.space{position:absolute;inset:0;overflow:hidden;perspective:1100px}.field{position:absolute;inset:0;transition:transform 2s cubic-bezier(.2,.8,.2,1)}.app.revealed .field{transform:scale(.9)}
.photo{position:absolute;left:50%;top:50%;width:64px;height:64px;padding:0;border:2px solid #ffffffc9;border-radius:50%;background:#14051f;overflow:hidden;box-shadow:0 9px 25px #000c,0 0 16px #ffffff1c;z-index:5;transition:border-color .3s,box-shadow .3s}.photo img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;border-radius:50%;pointer-events:none}.photo.seen{border-color:var(--gold);box-shadow:0 0 26px #ffd37dcc,0 9px 25px #000c}.photo:after{content:"";position:absolute;inset:-10px;border-radius:50%}
.modal{position:fixed;z-index:70;inset:0;display:none;place-items:center;background:#030008e8;padding:18px}.modal.on{display:grid}.card{position:relative;width:min(94vw,720px);max-height:90vh;border:1px solid #ffffff33;border-radius:24px;background:linear-gradient(145deg,#26103f,#090211);padding:14px}.card img{display:block;max-width:100%;max-height:78vh;margin:auto;object-fit:contain;border-radius:14px}.x{position:absolute;right:8px;top:8px;width:54px;height:54px;border-radius:50%;border:1px solid #ffffff44;background:#0a0212e8;color:#fff;font-size:25px;z-index:3}
.revealTitle{position:absolute;z-index:25;left:50%;bottom:5%;transform:translateX(-50%);text-align:center;opacity:0;visibility:hidden;transition:1s;pointer-events:none;white-space:nowrap}.app.revealed .revealTitle{opacity:1;visibility:visible}.revealTitle small{display:block;color:var(--gold);letter-spacing:.24em;text-transform:uppercase;font-size:10px}.revealTitle strong{font:italic clamp(25px,5vw,48px) Georgia,serif;color:#ff9bd2;text-shadow:0 0 25px #ff76c477}
@media(max-width:720px){.photo{width:43px;height:43px}.brand{font-size:16px}.status b{font-size:13px}.app.revealed .field{transform:scale(.94)}.revealTitle{bottom:3%}}@media(max-width:390px){.photo{width:39px;height:39px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.2s!important}}
</style></head><body><div class="sky"></div><div class="nebula"></div><div class="stars"></div>
<section class="open" id="open"><div><div class="eyebrow">Cosmic birthday anomaly detected</div><h1>The Universe Is Trying <em>to Spell Tin</em></h1><p>Forty-three memories are drifting through space. Explore them. Every memory you open begins moving into its place.</p><button class="pill" id="start">Enter the universe</button></div></section>
<main class="app" id="app"><header class="top"><div class="brand">Tin’s Memory Universe</div><div class="status">Memories explored <b id="meter">0 / 43</b></div></header><div class="space"><div class="field" id="field"></div></div><div class="revealTitle"><small>All 43 memories</small><strong>T I N ✨</strong></div></main>
<div class="modal" id="modal"><div class="card"><button class="x" id="close" aria-label="Close">×</button><img id="big" alt=""></div></div>
<script>
const TOTAL=43,app=document.getElementById('app'),field=document.getElementById('field'),meter=document.getElementById('meter'),modal=document.getElementById('modal'),big=document.getElementById('big'),seen=new Set(),cards=[];
const targets=[
[10,27],[14,27],[18,27],[22,27],[26,27],[30,27],[34,27],[22,35],[22,43],[22,51],[22,59],[22,67],[22,75],[22,83],[22,91],
[43,27],[50,27],[57,27],[50,35],[50,43],[50,51],[50,59],[50,67],[43,75],[50,75],[57,75],
[67,75],[67,65],[67,55],[67,45],[67,35],[67,27],[73,35],[77,43],[81,51],[85,59],[89,67],[93,75],[93,65],[93,55],[93,45],[93,35],[93,27]
];
const rand=(a,b)=>Math.random()*(b-a)+a;
for(let i=1;i<=TOTAL;i++){const b=document.createElement('button');b.className='photo';b.setAttribute('aria-label','Open photo '+i);b.innerHTML=`<img src="photos/${String(i).padStart(2,'0')}.jpg" alt="">`;const t=targets[i-1],o={el:b,n:i,seen:false,bx:rand(8,92),by:rand(14,88),ax:rand(5,12),ay:rand(4,10),sx:rand(.22,.55),sy:rand(.18,.46),p:rand(0,6.28),q:rand(0,6.28),tx:t[0],ty:t[1]};b.onclick=()=>openPhoto(o);cards.push(o);field.appendChild(b)}
function openPhoto(o){if(!o.seen){o.seen=true;seen.add(o.n);o.el.classList.add('seen');meter.textContent=`${seen.size} / 43`;if(seen.size===TOTAL)setTimeout(reveal,500)}big.src=`photos/${String(o.n).padStart(2,'0')}.jpg`;modal.classList.add('on')}
function reveal(){app.classList.add('revealed')}
document.getElementById('close').onclick=()=>modal.classList.remove('on');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('on')};document.getElementById('start').onclick=()=>{document.getElementById('open').classList.add('hide');app.classList.add('on')};
function animate(ms){const t=ms/1000,all=seen.size===TOTAL;cards.forEach(o=>{const cx=o.bx+Math.sin(t*o.sx+o.p)*o.ax+Math.cos(t*.31+o.q)*o.ax*.25,cy=o.by+Math.cos(t*o.sy+o.q)*o.ay+Math.sin(t*.39+o.p)*o.ay*.22;let mix=all?1:(o.seen?.93:0);const x=cx*(1-mix)+o.tx*mix,y=cy*(1-mix)+o.ty*mix,depth=1+Math.sin(t*.7+o.p)*.08*(1-mix);o.el.style.left=x+'%';o.el.style.top=y+'%';o.el.style.transform=`translate(-50%,-50%) scale(${depth})`;o.el.style.zIndex=o.seen?120:20+Math.round(depth*10)});requestAnimationFrame(animate)}requestAnimationFrame(animate);
</script></body></html>
